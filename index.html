<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>Gym</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--s1:#f5f5f7;--s2:#ececef;--s3:#e2e2e6;
  --line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.14);
  --tx:#111113;--dm:#5c5c63;--dm2:#8a8a91;
  --ac:#e0532f;--ac2:#f08a4b;--grn:#16a34a;--yel:#b45309;--blu:#2563eb;--red:#dc2626;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --card:none;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 26px -18px rgba(0,0,0,.25)
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
html,body{font-family:'DM Sans',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100%;overflow:hidden;overscroll-behavior:none}
body{font-feature-settings:"ss01"}
button,label.btn,[role=button]{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:inherit;cursor:pointer}
.num,input{font-variant-numeric:tabular-nums}
.app{height:100dvh;display:flex;flex-direction:column}
.cnt{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(130px + var(--sab));scrollbar-width:none;overscroll-behavior:contain}
.cnt::-webkit-scrollbar{display:none}

/* ── chrome: translucent header + tab bar ── */
.hdr{position:sticky;top:0;z-index:50;margin:0 -16px 6px;padding:calc(var(--sat) + 14px) 16px 12px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:.9;letter-spacing:.06em;background:linear-gradient(135deg,var(--ac) 20%,var(--ac2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:12px;color:var(--dm);margin-top:4px}
.chips{display:flex;gap:6px}
.chip{display:flex;flex-direction:column;align-items:center;min-width:52px;padding:6px 8px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.chip b{font-size:15px;line-height:1;font-weight:700}
.chip span{font-size:9px;color:var(--dm);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:space-around;padding:8px 0 calc(8px + var(--sab));background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:1px solid var(--line)}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--dm2);font-size:10px;font-weight:600;letter-spacing:.02em;padding:4px 28px;transition:transform 140ms var(--ease-out),color 160ms ease}
.nb:active{transform:scale(.92)}
.nb.a{color:var(--ac)}

/* ── generic ── */
.cd{background:var(--s1);background-image:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.cl{font-size:11px;color:var(--dm);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.cl em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500;color:var(--dm2)}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.12em;background:linear-gradient(135deg,var(--ac),#d9532f);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 24px -10px rgba(232,93,58,.7);transition:transform 140ms var(--ease-out),filter 140ms ease}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn.ghost{background:var(--s2);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.btn.ok{background:linear-gradient(135deg,#4ade80,#22c55e);color:#06210f;box-shadow:0 10px 24px -10px rgba(74,222,128,.6)}
.sb{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;font-size:11px;font-weight:600;letter-spacing:.02em;background:var(--s3);border:1px solid var(--line);border-radius:999px;color:var(--tx);transition:transform 120ms var(--ease-out),background 120ms ease}
.sb:active{transform:scale(.95);background:#d6d6db}
.sb svg{width:13px;height:13px}
.pill{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:999px}
.li{width:72px;padding:9px 6px;background:var(--bg);border:1px solid var(--line2);border-radius:11px;color:var(--tx);font-family:inherit;font-size:16px;font-weight:600;text-align:center;outline:none;transition:border-color 140ms ease,box-shadow 140ms ease}
.li:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(232,93,58,.18)}
.li::placeholder{color:var(--dm2);font-weight:500}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}

/* ── week + days ── */
.wk{display:flex;align-items:center;justify-content:space-between;margin:10px 0 10px}
.wk button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--s1);color:var(--tx);font-size:18px;display:grid;place-items:center;transition:transform 120ms var(--ease-out)}
.wk button:active{transform:scale(.92)}
.wk .t{text-align:center}
.wk .t b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.wk .t div{font-size:11px;color:var(--dm);margin-top:1px}
.today-link{display:block;margin:0 auto 10px;background:none;border:none;color:var(--ac);font-size:12px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.day{position:relative;padding:9px 0 10px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--dm);text-align:center;transition:transform 120ms var(--ease-out),background 160ms ease,color 160ms ease}
.day:active{transform:scale(.95)}
.day small{display:block;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.day b{display:block;font-size:16px;font-weight:700;margin-top:2px;color:var(--tx)}
.day em{display:block;height:13px;margin-top:2px;font-style:normal;font-size:10px;font-weight:800;color:var(--dm2)}
.day em.done{color:var(--grn)}
.day.sel em{color:#fff}
.day.fut{opacity:.65}
.day.is-today{border-color:rgba(232,93,58,.55)}
.day.sel{background:linear-gradient(160deg,#e85d3a,#cf4f2c);border-color:transparent;color:rgba(255,255,255,.85);box-shadow:0 8px 20px -10px rgba(232,93,58,.8)}
.day.sel b{color:#fff}
.day .dot{position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--grn)}
.day.sel .dot{background:#fff}

/* ── hero ── */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 100% 0%,rgba(232,93,58,.16),transparent 55%),var(--s1);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.hero h2{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:34px;line-height:.95;letter-spacing:.02em;margin-top:6px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.meta span{font-size:12px;padding:6px 10px;border-radius:999px;background:#ffffff;border:1px solid var(--line);color:var(--dm)}
.meta strong{color:var(--tx);font-weight:700}
.segs{display:flex;gap:4px;margin-top:16px}
.segs i{flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,.08)}
.segs i.on{background:var(--grn)}
.segl{display:flex;justify-content:space-between;font-size:11px;color:var(--dm);margin-top:7px}

/* ── warm-up list ── */
.wu{padding:4px 14px}
.wu-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.wu-row:last-child{border-bottom:none}
.wu-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(96,165,250,.12);color:var(--blu);flex-shrink:0}
.wu-row .n{flex:1;font-size:14px;font-weight:600}
.wu-row .n div{font-size:12px;color:var(--dm);font-weight:500;margin-top:1px}

/* ── exercise card ── */
.ex{background:var(--s1);background-image:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);transition:opacity 200ms ease}
.ex.done{border-color:rgba(22,163,74,.3);background:linear-gradient(180deg,rgba(22,163,74,.07),rgba(22,163,74,0) 60%),var(--s1)}
.ex-h{display:flex;gap:12px;align-items:flex-start}
.idx{width:34px;height:34px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px}
.ex-t{flex:1;min-width:0}
.ex-t h3{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.ex-t .p{font-size:12px;color:var(--dm);margin-top:2px}
.ex-t .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.swapped{font-size:11px;color:var(--yel);margin-top:6px;font-weight:600}
.acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.rx{display:flex;align-items:center;gap:10px;margin-top:12px;background:#ffffff;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.rx .big{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.04em;line-height:1}
.rx .lbl{font-size:10px;color:var(--dm);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.rx .nx{text-align:right}
.rx .nx b{font-size:18px;font-weight:800;display:block;line-height:1.2}
.tip{display:flex;gap:10px;margin-top:10px;padding:11px 12px;border-radius:14px;background:rgba(0,0,0,.03);border:1px solid var(--line)}
.tip i{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.tip b{font-size:12px;font-weight:800;letter-spacing:.01em}
.tip p{font-size:12px;color:var(--dm);line-height:1.55;margin-top:3px}
.note{font-size:11px;color:var(--dm2);margin-top:9px;font-style:italic}
.log{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line2)}
.log-h{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--ac);text-transform:uppercase;margin-bottom:8px}
.log-h span{color:var(--dm2);letter-spacing:0;text-transform:none;font-weight:500}
.set{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.set .s{width:34px;font-size:11px;font-weight:800;color:var(--dm);letter-spacing:.04em}
.set .s.max{color:var(--ac)}
.set .x{color:var(--dm2);font-size:13px}
.rest{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--s3);color:var(--ac);display:grid;place-items:center;transition:transform 120ms var(--ease-out)}
.rest:active{transform:scale(.92)}
.mode{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--line2)}
.mode b{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dm)}
.mode span{display:block;font-size:13px;font-weight:700;margin-top:2px}
.mode em{display:block;font-style:normal;font-size:12px;color:var(--blu);margin-top:5px;font-weight:600}
.gear{min-width:44px;justify-content:center;color:var(--dm);cursor:pointer}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 14px);z-index:300;transform:translate(-50%,-12px);opacity:0;padding:10px 16px;border-radius:999px;background:#111113;color:#fff;font-size:14px;font-weight:700;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);transition:transform 260ms var(--ease-out),opacity 200ms ease;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.rir{height:40px;min-width:54px;padding:0 6px;border-radius:12px;border:1px dashed var(--line2);background:none;color:var(--dm2);font-size:11px;font-weight:700;transition:transform 120ms var(--ease-out)}
.rir:active{transform:scale(.94)}
.rir.on{border-style:solid;border-color:transparent;background:rgba(37,99,235,.1);color:var(--blu)}
.set .rest{margin-left:0}.set .rir{margin-left:auto}
.logged .st small{font-size:11px;font-weight:600;opacity:.75}
.seat{display:flex;align-items:center;gap:8px;margin-top:10px;padding:0 12px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.seat span{color:var(--dm2);display:grid}
.seat input{flex:1;min-width:0;border:none;outline:none;background:none;font:inherit;font-size:16px;color:var(--tx);padding:10px 0}
.seat input::placeholder{color:var(--dm2)}
.pr{text-align:center;margin-bottom:6px}
.tro{font-size:44px;line-height:1;margin:2px 0 6px;animation:pop 520ms var(--ease-out) both}
@keyframes pop{from{transform:scale(.6) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.prrow{display:flex;flex-direction:column;gap:2px;margin:10px 0 0;padding:10px 12px;border-radius:12px;background:rgba(202,138,4,.1);border:1px solid rgba(202,138,4,.25);text-align:left}
.prrow b{font-size:14px}.prrow span{font-size:13px;color:#92400e;font-weight:600}
.vol{padding:12px 14px}
.vr{display:grid;grid-template-columns:84px 1fr 26px 22px;align-items:center;gap:8px;padding:5px 0}
.vr span{font-size:13px;font-weight:600}
.vr b{font-size:14px;text-align:right}.vr small{font-size:11px;color:var(--dm2);text-align:right}
.vb{position:relative;height:10px;border-radius:5px;background:rgba(0,0,0,.06);overflow:hidden}
.vb i{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.vb .zone{background:rgba(22,163,74,.15);border-radius:0}
@media (prefers-reduced-motion:reduce){.tro{animation:none}}
.hero-ch{position:absolute;top:14px;right:14px}
.hero .eyebrow{padding-right:96px}
.day.skip{opacity:.45}.day.skip b{text-decoration:line-through}
.blk{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:#fff;border:1px solid var(--line2);color:var(--dm)}
.blk.up{color:var(--grn);border-color:rgba(22,163,74,.3)}
.blk.dl{color:var(--blu);border-color:rgba(37,99,235,.3);background:rgba(37,99,235,.06)}
.vid{display:flex;gap:12px;align-items:center;margin-top:14px;padding:8px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-decoration:none;color:var(--tx);transition:transform 120ms var(--ease-out)}
.vid:active{transform:scale(.98)}
.vth{position:relative;width:132px;flex-shrink:0;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.ms .vth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;margin:0;border-radius:0}
.vpl{position:absolute;inset:0;display:grid;place-items:center}
.vpl i{width:34px;height:34px;border-radius:50%;background:rgba(224,83,47,.92);position:relative}
.vpl i:after{content:"";position:absolute;left:13px;top:10px;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
.vdur{position:absolute;right:5px;bottom:5px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.75);padding:1px 5px;border-radius:5px}
.vmeta b{display:block;font-size:14px;color:var(--ac)}
.vmeta small{display:block;font-size:12px;color:var(--dm);margin-top:3px}
.svd{font-size:11px;font-weight:700;color:var(--grn);margin-top:6px}
.svd:empty{display:none}
.seq{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:800;color:var(--dm2)}
.seq span{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:#fff;border:1px solid var(--line2)}
.seq span.on{background:var(--ac);border-color:transparent;color:#fff}
.seq i{font-style:normal;font-weight:500}
.pick3{display:flex;justify-content:center;gap:8px;margin-top:12px}
.pick3 .sb{min-width:56px;justify-content:center;font-size:15px;padding:10px 14px}
.calh:empty{display:none}
.gear{margin-top:10px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--grn) 8%,#fff);border:1px solid color-mix(in srgb,var(--grn) 35%,transparent)}.gear b{font-size:14px}.gear p{font-size:12px;color:var(--dm);margin:4px 0 10px}.gb{display:flex;gap:8px}.gb button{flex:1;padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:13px;color:var(--tx)}.gb .yes{background:var(--grn);border-color:var(--grn);color:#fff}.gb button:active{transform:scale(.97)}
.gna{margin-top:8px;font-size:11px;color:var(--dm);display:flex;flex-wrap:wrap;gap:6px;align-items:center}.gna button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 9px;font:inherit;font-size:11px;color:var(--dm)}
.cal{margin:0 0 9px 42px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) 8%,#fff);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.cal b{display:block;font-size:13px;font-weight:800;color:var(--c)}
.cal p{font-size:12px;color:var(--dm);line-height:1.5;margin-top:2px}
.cal .sb{margin-top:8px;background:var(--c);color:#fff;border-color:transparent}
.cal .ok{margin-top:6px;font-size:12px;font-weight:700;color:var(--grn)}
.logged{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.logged .st{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(22,163,74,.1);color:var(--grn)}
.logged .st.part{background:rgba(250,204,21,.12);color:var(--yel)}
.felt{display:flex;margin-top:10px;padding:3px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.felt button{flex:1;padding:8px 4px;border:none;border-radius:9px;background:none;color:var(--dm);font-size:12px;font-weight:600;transition:background 160ms ease,color 160ms ease,transform 120ms var(--ease-out)}
.felt button:active{transform:scale(.96)}
.felt button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.felt button.on.l{color:var(--blu)}.felt button.on.k{color:var(--grn)}.felt button.on.h{color:var(--ac)}
.savebar{margin-top:6px}

/* ── sheets ── */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:200;display:flex;align-items:flex-end;opacity:0;transition:opacity 300ms ease}
.mo.open{opacity:1}
.ms{background:#fff;width:100%;border-radius:24px 24px 0 0;border-top:1px solid var(--line2);max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;padding:10px 18px calc(28px + var(--sab));transform:translateY(100%);transition:transform 440ms var(--ease-drawer)}
.mo.open .ms{transform:translateY(0)}
.mo.closing{transition-duration:200ms}
.mo.closing .ms{transition:transform 220ms var(--ease-out)}
.grab{width:38px;height:5px;background:var(--s3);border-radius:3px;margin:0 auto 16px}
.ms .ttl{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.03em;line-height:1}
.ms h4{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin:18px 0 6px}
.ms p,.ms li{font-size:14px;line-height:1.6;color:var(--dm)}
.ms ul{padding-left:18px}
.ms li{margin-bottom:3px}
.ms img{width:100%;display:block;border-radius:14px;margin-top:14px}
.opt{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px;color:var(--tx);transition:transform 120ms var(--ease-out),border-color 160ms ease}
.opt:active{transform:scale(.98)}
.opt.cur{border-color:var(--ac)}
.opt b{font-size:15px;font-weight:700}
.opt small{display:block;font-size:12px;color:var(--dm);margin-top:2px;font-weight:500}
.opt .last{font-size:11px;margin-top:5px;font-weight:600}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.ck{width:58px;height:58px;margin:4px auto 10px;border-radius:50%;display:grid;place-items:center;background:rgba(74,222,128,.14)}
.ck path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw 420ms var(--ease-out) 180ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ── rest timer (floating pill — never re-renders the page) ── */
#timer{position:fixed;left:50%;bottom:calc(84px + var(--sab));z-index:150;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;border-radius:999px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--line2);box-shadow:0 14px 34px -12px rgba(0,0,0,.28);transform:translate(-50%,24px) scale(.96);opacity:0;pointer-events:none;transition:transform 300ms var(--ease-out),opacity 200ms ease}
#timer.on{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
#timer .ring{width:36px;height:36px;transform:rotate(-90deg)}
#timer .ring circle{fill:none;stroke-width:4}
#timer .tt{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.06em;min-width:58px}
#timer button{height:42px;min-width:56px;padding:0 14px;touch-action:manipulation;-webkit-user-select:none;user-select:none;border-radius:999px;border:1px solid var(--line2);background:var(--s3);color:var(--tx);font-size:12px;font-weight:700;transition:transform 120ms var(--ease-out)}
#timer button:active,#timer button.pr{transform:scale(.94)}
#timer button.k{background:var(--ac);border-color:transparent;color:#fff}

/* ── progress tab ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.stat{background:var(--s1);background-image:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.stat b{font-family:'Bebas Neue',sans-serif;font-size:34px;font-weight:400;line-height:1;color:var(--ac);letter-spacing:.02em}
.stat span{display:block;font-size:11px;color:var(--dm);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-top:4px}
.hist{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.bar{height:5px;background:rgba(0,0,0,.07);border-radius:3px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--ac),var(--ac2))}

@media (hover:hover) and (pointer:fine){
  .sb:hover,.wk button:hover,.rest:hover{background:#d9d9de}
  .day:not(.sel):hover{background:var(--s2)}
  .opt:hover{border-color:var(--line2)}
}
@media (prefers-reduced-motion:reduce){
  .ms,.mo.closing .ms{transform:none!important;transition:none}
  .mo{transition:opacity 150ms ease}
  #timer{transition:opacity 150ms ease;transform:translate(-50%,0)}
  .ck path{animation:none;stroke-dashoffset:0}
  *:active{transform:none!important}
}
</style>

// ── Dates: LOCAL calendar dates (v6 used UTC, which flips to "tomorrow" after 7-8pm in Ohio) ──
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return ymd(new Date())}
function pd(s){const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function daysBetween(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function mondayOf(off){const n=new Date(),dow=n.getDay(),mo=dow===0?-6:1-dow;return new Date(n.getFullYear(),n.getMonth(),n.getDate()+mo+off*7)}
function dayKey(di,off){const m=mondayOf(off);return ymd(new Date(m.getFullYear(),m.getMonth(),m.getDate()+di))}

// Training blocks: weeks 1-2 base, weeks 3-4 +1 set on the day's first two lifts, week 5 = deload (half the sets, ~90% weight, no failure)
const BLK=5;
function blkWeek(dk){if(!U.blk)return 1;return((Math.floor(Math.round((pd(dk)-pd(U.blk))/864e5)/7)%BLK)+BLK)%BLK+1}
function blkNum(dk){return Math.floor(Math.floor(Math.round((pd(dk)-pd(U.blk))/864e5)/7)/BLK)+1}
// ── Schedule: A → B → C in order, on whatever days you train ──
function trainedExcept(dk,sid){for(const [k,ls] of Object.entries(U.logs))if(k!==sid)for(const l of ls)if((l.day||l.date)===dk)return true;return false}
function trained(dk){for(const ls of Object.values(U.logs))for(const l of ls)if((l.day||l.date)===dk)return true;return false}
function weekStart(dk){const d=pd(dk);return ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)))}
// workouts already done this week (Mon–Sun) before dk, in the full-body program
function doneThisWeek(dk){const ws=weekStart(dk);return Object.keys(U.sched).filter(k=>k>=ws&&k<dk&&trained(k)).sort().map(k=>U.sched[k])}
function nextSlot(done){for(let i=0;i<WO.length;i++)if(!done.includes(i))return i;return done.length%WO.length} // first not done yet; a 4th session cycles
function woIdx(dk){if(U.sched[dk]!=null)return U.sched[dk];const t=today();if(dk<t)return null;if(dk===t)return nextSlot(doneThisWeek(t));
  return weekStart(dk)===weekStart(t)?nextSlot(doneThisWeek(t).concat(woIdx(t))):0}
function sessNo(dk){return Object.keys(U.logs).length?[...new Set(Object.values(U.logs).flat().map(l=>l.day||l.date).filter(k=>k>=weekStart(dk)&&k<dk))].length+1:1}
function woOf(dk){const i=woIdx(dk);if(i==null||!WO[i])return null;const base=WO[i],bw=blkWeek(dk),dl=bw===BLK;
  return Object.assign({},base,{i,blk:{wk:bw,dl,n:blkNum(dk)},ex:base.ex.map((e,k)=>dl?Object.assign({},e,{s:Math.max(1,Math.ceil(e.s/2)),n:"Deload: stop 3–4 reps short on every set — no failure"}):bw>=3&&k<2?Object.assign({},e,{s:e.s+1,n:"+1 set this week (block week "+bw+") · "+e.n}):e)})}
function getWO(di,off){return woOf(dayKey(di,off===undefined?weekOff:off))}
function canLogD(dk){const t=today();return dk<=t&&daysBetween(dk,t)<=7}

  const fmt=x=>x.map(s=>(s.w||"BW")+"×"+s.r).join(", ");
  if(prevRange)return{t:"rng",W:fin.w,nw:tgtW,m:"NEW REP RANGE → "+tgtW+" lbs",d:"Last time ("+fmt(sets)+") was in the "+prevRange.replace("-","–")+" range; now it's "+lo+"–"+hi+". From those sets, "+tgtW+" lbs should give ~"+(lo+1)+" reps with 2 left.",nr:lo+"-"+(lo+2)};

  let W=first.w,adj=false;

  if(ws.every(s=>s.r>=hi))return{t:"inc",W,nw:W+inc,m:"INCREASE to "+(W+inc)+" lbs",d:"You hit "+hi+"+ reps on every set at "+W+" lbs. Go up; reps drop to ~"+lo+", then build back up.",nr:lo+"-"+(lo+2)};
  if(eAvg<lo-1||l.r<lo-2){const nw=Math.max(inc,W-inc);return{t:"adj",W,nw,m:"EASE BACK to "+nw+" lbs",d:"At "+W+" lbs your reps faded well below "+lo+" ("+ws.map(s=>s.r).join(", ")+"). One step lighter keeps you in "+lo+"–"+hi+".",nr:lo+"-"+(lo+2)}}

}
// last day you trained anything (today excluded)

function lastGymDay(){let m="";const t=today();for(const ls of Object.values(U.logs))for(const l of ls)if(l.date<t&&l.date>m)m=l.date;return m}
function incOf(id){const c=U.cfg||{};return isDB(id)?(c.db||2.5):(c.mach||5)}
function getRec(logs,reps,eid){

  if(!logs.length)return{t:"new",m:"First time - pick a starting weight",d:"Choose a weight you could do for about "+(lo+2)+" reps, then stop at "+lo+" (2 left in the tank). Tap 'Felt' after you log and the app corrects from there.",nw:null,nr:lo+"-"+hi};
  const last=logs[logs.length-1],P=progFrom(last.sets,lo,hi,inc,last.rr&&last.rr!==reps?last.rr:null),W=P.W,fb=last.fb;
  // Back after a break = time away from the GYM (2+ weeks), not gaps between sessions of one exercise
  const exGap=daysBetween(allLogs[allLogs.length-1].date,today()),lg=lastGymDay(),away=lg?daysBetween(lg,today()):exGap;
  if(exGap>=21&&away>=21){const f=away>=56?.85:away>=28?.9:.95,nw=down(W*f);return{t:"ret",m:"WELCOME BACK - "+Math.round(away/7)+" weeks off",d:"Start at "+nw+" lbs (~"+Math.round(f*100)+"% of your last "+W+" lbs) and aim for "+lo+"-"+(lo+2)+" reps with 2 left. Strength comes back fast: if today goes well, the next sessions jump back toward "+W+" lbs.",nw,nr:lo+"-"+(lo+2)}}
  if(P.t==="rng")return P;

  if((P.t==="mnt"||P.t==="inc")&&last.sets[0].r>=lo){for(let j=logs.length-1;j>=Math.max(1,logs.length-4);j--){if(gymGapBefore(logs[j].date)>=21){const W0=progFrom(logs[j-1].sets,lo,hi,inc,null).W;

  if(fb==="heavy"&&P.nw>W)return{t:"mnt",m:"HOLD "+W+" lbs",d:"You marked it too heavy last time, so no increase yet. Match or beat last time with clean form.",nw:W,nr:P.nr};

// ── Available weights: the app never assumes a weight exists — it asks before every increase ──
function gearOf(eid){return U.gear[eid]||(U.gear[eid]={na:[]})}
const r1=x=>Math.round(x*100)/100;
function isNA(eid,w){return gearOf(eid).na.includes(r1(w))}
function availUp(eid,w,inc){let n=r1(w),k=0;while(isNA(eid,n)&&k++<40)n=r1(n+inc);return n}
function availDown(eid,w,inc){let n=r1(w),k=0;while(isNA(eid,n)&&n-inc>0&&k++<40)n=r1(n-inc);return n}
function estOf(l){const n=l.sets.length;return Math.max(...l.sets.map((x,i)=>e1rm(x.w,x.r+(x.q!=null?x.q:(i===n-1?0:2)))))}
function gearAdj(rec,logs,reps,eid){
  if(!rec||!rec.nw)return rec;const L=(logs||[]).filter(l=>!l.dl);if(!L.length)return rec;
  const last=L[L.length-1],W=rec.W!=null?rec.W:topW(last),inc=incOf(eid),p=reps.split("-").map(Number),lo=p[0],hi=p[1],est=estOf(last);
  const repsAt=w=>Math.floor(30*(est/w-1))-2; // reps you'd get with ~2 left
  if(rec.nw>W){
    const n=availUp(eid,rec.nw,inc);if(n===r1(rec.nw))return Object.assign({},rec,{up:n,W});
    const sk=gearOf(eid).na.filter(x=>x>W&&x<n).sort((a,b)=>a-b).join(", ");
    const er=repsAt(n);
    if(er>=lo-3)return{t:"inc",W,nw:n,up:n,m:"NEXT AVAILABLE: "+n+" lbs",d:"You don't have "+sk+" lbs, so the next step is "+n+". Expect about "+Math.max(er,1)+" reps at first — that's fine, still muscle-building range. Stay at "+n+" and build back up to "+lo+"–"+hi+".",nr:Math.max(er,lo-3)+"+ reps"};
    const need=Math.ceil(30*(n*(1+(lo-1)/30)/W-1));
    return{t:"mnt",W,nw:W,m:"BUILD PAST "+hi+" — next is "+n+" lbs",d:"The next weight up ("+n+" lbs, since "+sk+" isn't available) is a big jump from "+W+". Stay at "+W+" and keep adding reps beyond "+hi+" (anything up to ~30 still builds muscle). Once you reach about "+need+" reps per set, "+n+" lbs will land you near "+(lo-2)+"–"+lo+" reps.",nr:need+" reps/set"};
  }
  if(rec.nw<W){
    const n=availDown(eid,rec.nw,inc);if(n===r1(rec.nw)||n>=W)return rec;
    // the lighter weight isn't there either; only drop to n if the reps were clearly too low
    const f=last.sets[0];
    if(rec.t==="ret"||f.r<lo-3)return Object.assign({},rec,{nw:n,m:rec.m.replace(/[\d.]+ lbs/,n+" lbs"),d:rec.d+" ("+r1(rec.nw)+" lbs isn't available, so "+n+".)"});
    return{t:"mnt",W,nw:W,m:"STAY AT "+W+" lbs",d:"One step lighter ("+r1(rec.nw)+") isn't available, so keep "+W+" lbs. Reps a little under "+lo+" are fine here — build them back up session by session.",nr:Math.max(lo-3,1)+"+ reps"};
  }

}
function gearYes(sid,dk,n){U.gq[dk+"|"+sid]=n;const D=DR[dk]||{},t=D.__t||{};for(let i=0;i<12;i++){const k=sid+"-"+i+"-w";if(!t[k]&&!(parseInt(D[sid+"-"+i+"-r"])>0))D[k]=String(n)}saveDraftNow();saveU();render()}

// ── Auto-save: every set is written to your log as soon as you enter it ──
let PLAN={},asT={};
function draftReps(sid,D){D=D||logD;for(let i=0;i<12;i++)if(parseInt(D[sid+"-"+i+"-r"])>0)return true;return false}

let pendingRender=false,rendering=false;

// returns {sets, miss} where miss = set numbers that have reps but no usable weight
function readSets(sid,n,D){D=D||logD;const sets=[],miss=[];for(let i=0;i<n;i++){const r=parseInt(D[sid+"-"+i+"-r"])||0;if(!(r>0))continue;const raw=D[sid+"-"+i+"-w"],w=num(raw),q=D[sid+"-"+i+"-q"];if(raw==null||String(raw).trim()===""||isNaN(w)||w<0){miss.push(i+1);continue}sets.push(q!==undefined?{w,r,q}:{w,r})}return{sets,miss}}
function autoSave(sid,finish,stay){ // stay = save but keep the card open (tap-out between boxes)
  clearTimeout(asT[sid]);asT[sid]=null;const pl=PLAN[sid];if(!pl)return null;const dk=pl.dk,D=DR[dk]||{};
  if(rendering)return null; // a box removed by a redraw fires "change" — the redraw already saved everything

  saveDraft();return sets.length?sets:null;
}
function saveSess(){ // "Finish workout": flush every open exercise, then show the summary
  const dk=selDate,wo=woOf(dk);if(!wo)return;const noW=[];
  Object.keys(PLAN).forEach(sid=>{const {miss}=readSets(sid,12,DR[dk]||{});miss.forEach(m=>noW.push(EX[sid].name+" set "+m))});

  wo.ex.forEach(e=>{const sid=effId(dk,e.id),f=logFor(sid,dk);summary.push({name:EX[sid].name,sets:f?f.sets:null,plan:e.s,partial:f&&f.sets.length<e.s});if(f&&f.pr&&f.date===today())prs.push({name:EX[sid].name,txt:f.prt||"New best"})});

  const name="gym-backup-"+today()+".json";

    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Gym backup"}).then(done).catch(()=>{});return}}catch(e){}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();done();
}

  const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(rd.result),d=j.data||j;if(!d._u||!d._u.logs)throw new Error("Not a Gym backup file");

    sv(d);U=d._u;normU();DR={};saveDraftNow();render();alert("Backup restored ✅")}catch(e){alert("Could not import: "+e.message)}};

function tint(c,a){return c+(a||"22")}

// ── Bottom sheets: slide up with an iOS-like drawer curve, exit faster than enter ──
function openSheet(inner){
  const m=document.createElement("div");m.className="mo";
  m.innerHTML=`<div class="ms" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div>`;
  m.addEventListener("click",e=>{if(e.target===m)closeSheet(m)});
  document.body.appendChild(m);m.offsetHeight;m.classList.add("open");return m;
}
function closeSheet(el){const m=el&&el.closest?el.closest(".mo"):null;if(!m||m.classList.contains("closing"))return;m.classList.add("closing");m.classList.remove("open");setTimeout(()=>m.remove(),230)}
function closeAll(){document.querySelectorAll(".mo .ms").forEach(closeSheet)}

// ── Rest timer: floating pill, updates itself only (no full re-render → keyboard/typing never interrupted) ──
let timerEnd=0,timerTotal=0;
function ensureTimer(){
  if(document.getElementById("timer"))return;
  document.body.insertAdjacentHTML("beforeend",`<div id="timer" role="timer"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" stroke="rgba(0,0,0,.1)"/><circle class="arc" cx="18" cy="18" r="15" stroke="var(--ac)" stroke-linecap="round" stroke-dasharray="94.25" stroke-dashoffset="0"/></svg><span class="tt num">0:00</span><button type="button" data-t="add">+15s</button><button type="button" class="k" data-t="skip">Skip</button></div>`);
  const el=document.getElementById("timer");
  // iPhone: act on the touch itself (before the keyboard closes and shifts the screen), and keep focus in the reps box
  const act=(e,b)=>{const now=Date.now();if(now-(+b.dataset.at||0)<400)return;b.dataset.at=now;b.dataset.t==="add"?addTime(15):stopTimer()}; // a touch also fires a click: count it once
  el.querySelectorAll("button").forEach(b=>{
    b.addEventListener("touchstart",e=>{e.preventDefault();b.classList.add("pr")},{passive:false});
    b.addEventListener("touchend",e=>{e.preventDefault();b.classList.remove("pr");act(e,b)},{passive:false});
    b.addEventListener("touchcancel",()=>b.classList.remove("pr"));
    b.addEventListener("mousedown",e=>e.preventDefault());
    b.addEventListener("click",e=>act(e,b))});
  placeTimer();
}
// keep the pill just above the keyboard when it's open
function placeTimer(){const el=document.getElementById("timer"),vv=window.visualViewport;if(!el)return;if(!vv){el.style.bottom="";return}
  const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);el.style.bottom=kb>80?(kb+12)+"px":""}
if(window.visualViewport){visualViewport.addEventListener("resize",placeTimer);visualViewport.addEventListener("scroll",placeTimer)}
let actx=null,wlock=null;
function audio(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}return actx}
function beep(){const a=audio();if(!a||U.cfg.sound===false)return;const t=a.currentTime+.02;[0,.22,.44].forEach((d,i)=>{const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=i===2?1320:880;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.5,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.18);o.connect(g);g.connect(a.destination);o.start(t+d);o.stop(t+d+.2)})}
async function wake(on){try{if(on&&!wlock&&navigator.wakeLock){wlock=await navigator.wakeLock.request("screen");wlock.addEventListener("release",()=>wlock=null)}else if(!on&&wlock){await wlock.release();wlock=null}}catch(e){}}
function startTimer(sec){audio();wake(true);ensureTimer();timerTotal=sec;timerEnd=Date.now()+sec*1000;clearInterval(timerInt);timerInt=setInterval(tickTimer,250);tickTimer()}
function addTime(s){timerEnd+=s*1000;timerTotal+=s;tickTimer()}
function tickTimer(){
  const el=document.getElementById("timer");const ms=timerEnd-Date.now();
  if(ms<=0){stopTimer();beep();if("vibrate"in navigator)navigator.vibrate([200,100,200]);toast("Rest done — next set 💪");return}
  const s=Math.ceil(ms/1000);el.querySelector(".tt").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  el.querySelector(".arc").setAttribute("stroke-dashoffset",(94.25*(1-ms/(timerTotal*1000))).toFixed(2));
  el.classList.add("on");
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&timerInt)tickTimer()});
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);el.offsetHeight;el.classList.add("on");setTimeout(()=>{el.classList.remove("on");setTimeout(()=>el.remove(),300)},2200)}
function stopTimer(){clearInterval(timerInt);timerInt=null;wake(false);const el=document.getElementById("timer");if(el)el.classList.remove("on")}

// ── Swap sheet ──
function showSwap(dk,id){
  const wo=woOf(dk);const planned=wo.ex.map(x=>effId(dk,x.id));const cur=effId(dk,id);
  const opts=(ALT[id]||[]).filter(a=>!planned.includes(a)||a===cur);
  let c=`<div class="ttl">Swap exercise</div><p style="margin:6px 0 14px">${h(EX[id].name)} busy or broken? These hit the same muscles with your gym's equipment. Sets, reps and rest stay the same; each one tracks its own progress.</p>`;
  if(cur!==id)c+=swapOpt(dk,id,id,true,cur);
  if(!opts.length)c+=`<p>No equivalent alternative that isn't already in today's plan. Do the rest first and come back to it.</p>`;
  opts.forEach(a=>{if(a!==id)c+=swapOpt(dk,id,a,false,cur)});
  c+=`<button class="btn ghost" style="margin-top:8px" onclick="closeSheet(this)">Cancel</button>`;
  openSheet(c);
}
function swapOpt(dk,id,a,orig,cur){
  const d=EX[a],lg=U.logs[a]||[],last=lg[lg.length-1],mc=MC[a];

}
function setSwap(dk,id,alt){if(alt===id)delete U.swaps[swapKey(dk,id)];else U.swaps[swapKey(dk,id)]=alt;saveU();closeAll();render()}

function spark(logs){

      }
      if(showSci)out+=`<div class="cd" style="border-top:none;border-top-left-radius:0;border-top-right-radius:0;margin-top:-1px"><p style="font-size:13px;color:var(--dm);line-height:1.7"><strong style="color:var(--tx)">Schedule:</strong> weeks run Monday–Sunday. Your 1st session of the week is A, the 2nd is B, the 3rd is C, whatever days you go. On 2-day weeks A + B already train every muscle; C adds extra volume. Aim for a rest day between sessions. Tap Change to pick a different one; tap a past day (up to 7 days back) to log a workout you forgot.<br><br><strong style="color:var(--tx)">Effort:</strong> Early sets stop with 2 reps left. Last set = failure.<br><br><strong style="color:var(--tx)">Progression:</strong> Each exercise has one rep range. Hit the top of it on every set → go up one step (set your gym\'s steps in ⚙ Settings). Otherwise keep the weight and add reps. Losing 1–2 reps on the failure set is normal and never lowers your weight.<br><br><strong style="color:var(--tx)">When it lowers the weight:</strong> only if your first set was already below the range, or your reps faded well below it. Days between sessions never count against you. Only time away from the gym does: under 3 weeks no change (strength holds ~4 weeks); 3–4 weeks → 95%, 4–8 weeks → 90%, 8+ weeks → 85% for the first session, then it jumps back toward your old weight as soon as your reps look good.<br><br><strong style="color:var(--tx)">Auto-save:</strong> each set saves by itself about a second after you enter it. Finish workout just shows your summary.<br><br><strong style="color:var(--tx)">Busy machine:</strong> tap Swap for an equivalent exercise.<br><br><strong style="color:var(--tx)">Training blocks:</strong> 5 weeks. Weeks 1–2 base, weeks 3–4 one extra set on the first two lifts, week 5 deload (half the sets, ~90% weight, no failure).<br><br><strong style="color:var(--blu)">Posture:</strong> Rows + rear delts + warm-ups.</p></div>`;
    }
  } else {
    const ids=Object.keys(U.logs).filter(id=>EX[id]),ts=Object.values(U.logs).reduce((a,l)=>a+l.reduce((b,e)=>b+e.sets.length,0),0);
    out+=`<header class="hdr"><div><div class="logo">Progress</div><div class="sub">Every session, every set</div></div></header>`;
    out+=`<div class="stats">${[[U.sess||0,"Sessions"],[wk,"Week"],[ids.length,"Exercises"],[ts,"Total sets"]].map(([v,l])=>`<div class="stat"><b class="num">${v}</b><span>${l}</span></div>`).join("")}</div>`;
    out+=bwCard();
    out+=volCard();
    out+=`<div class="cl">Backup</div><div class="cd"><p style="font-size:13px;color:var(--dm);line-height:1.6">Your logs live only on this phone. Export a backup file and keep it in iCloud Drive / Files. ${U.lastBk?`Last backup: <strong class="num" style="color:var(--tx)">${fmtD(U.lastBk)}</strong>`:`<strong style="color:var(--yel)">No backup yet.</strong>`}</p><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="font-size:16px;padding:12px" onclick="exportData()">Export</button><label class="btn ghost" role="button" style="font-size:16px;padding:12px;text-align:center;display:block">Import<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label></div></div>`;
    out+=`<div class="cl">Exercise history <em>tap for sessions</em></div>`;
    if(!ids.length)out+=`<div class="cd" style="text-align:center;padding:28px"><p style="color:var(--dm)">Complete your first workout to see progress here.</p></div>`;
    else ids.forEach(id=>{
      const d=EX[id],logs=U.logs[id],fw=topW(logs[0]),lw=topW(logs[logs.length-1]),ch=lw-fw,op=progOpen===id,mc=MC[id]||"#e0532f";
      out+=`<div class="cd" onclick="progOpen=progOpen==='${id}'?null:'${id}';render()" style="cursor:pointer"><div style="display:flex;justify-content:space-between;gap:10px"><div style="min-width:0"><div style="display:flex;gap:7px;align-items:center"><span style="width:8px;height:8px;border-radius:50%;background:${mc};flex-shrink:0"></span><b style="font-size:15px">${h(d.name)}</b></div><div style="font-size:12px;color:var(--dm);margin-top:3px">${logs.length} session${logs.length===1?"":"s"} · last ${fmtD(logs[logs.length-1].date)}</div></div><div style="text-align:right;flex-shrink:0"><div class="num" style="font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:${ch>0?"var(--grn)":ch<0?"var(--ac)":"var(--dm)"}">${ch>0?"+":""}${ch} lbs</div><div class="num" style="font-size:11px;color:var(--dm);margin-top:2px">${fw} → ${lw} lbs</div></div></div>${spark(logs)}`;
      if(op){out+=`<div style="margin-top:10px;border-top:1px solid var(--line)" onclick="event.stopPropagation()">`;
        logs.map((l,i)=>[l,i]).reverse().forEach(([l,i])=>{out+=`<div class="hist"><span class="num" style="color:var(--dm);width:54px">${fmtD(l.date)}</span><span class="num" style="flex:1;font-weight:600">${l.pr?"🏆 ":""}${l.dl?`<span style="color:var(--blu);font-weight:500">deload · </span>`:""}${l.sets.map(s=>s.w+"×"+s.r).join(", ")}${l.fb&&l.fb!=="ok"?` <span style="color:var(--yel);font-weight:500">(${l.fb==="light"?"too light":"too heavy"})</span>`:""}</span><button class="sb" style="color:var(--red)" onclick="delLog('${id}',${i})">Delete</button></div>`});
        out+=`</div>`}
      out+=`</div>`;
    });
  }

  const navH=`<nav class="nav"><button class="nb ${tab==="today"?"a":""}" onclick="tab='today';render()"><svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Workout</button><button class="nb ${tab==="progress"?"a":""}" onclick="tab='progress';render()"><svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progress</button></nav>`;

  const sc=document.getElementById("scroll"),top=sc?sc.scrollTop:0,tabNow=tab;
  rendering=true;try{app.innerHTML=`<div class="cnt" id="scroll">${out}</div>${navH}`}finally{rendering=false}
  document.getElementById("scroll").scrollTop=(render._tab===tabNow)?top:0;render._tab=tabNow;Object.keys(CAL).forEach(calAll);
  Object.keys(PLAN).forEach(sid=>{if(draftReps(sid))autoSave(sid,false,true)}); // sets completed by a pre-filled weight are saved right away
}

// ── How-to sheets ──
function vidCard(v){if(!v)return"";const[id,ch,sec]=v;return `<a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener noreferrer" class="vid"><div class="vth"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy"><div class="vpl"><i></i></div><span class="vdur num">${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}</span></div><div class="vmeta"><b>▶ Watch form tutorial</b><small>${h(ch)} · opens YouTube</small></div></a>`}
function showModal(id){
  const d=EX[id],t=d.tech,img=EX_IMAGES[id]||(d.imgOf&&EX_IMAGES[d.imgOf]),vid=EX_VIDEOS[id];
  let c=`<div class="ttl">${h(d.name)}</div><div style="font-size:13px;color:var(--dm);margin-top:4px">${h(d.machine)}</div>${d.mode?`<div class="mode" style="margin-top:12px"><b>⚙ Machine setting</b><span>${h(d.mode)}</span></div>`:""}`;
  if(d.pos)c+=`<span class="pill" style="color:var(--blu);background:rgba(96,165,250,.14);margin-top:8px">HELPS POSTURE</span>`;
  if(img)c+=`<img src="${img}" alt="" onerror="this.style.display='none'">`;
  if(vid)c+=vidCard(vid);
  if(!vid)c+=`<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(d.name+" proper form")}" target="_blank" rel="noopener noreferrer" class="opt" style="justify-content:center;color:var(--ac);font-weight:700;margin-top:14px;text-decoration:none">▶ Watch form demos on YouTube</a>`;
  c+=`<h4>Setup</h4><p>${h(t.setup)}</p><h4>Execution</h4><p>${h(t.exec)}</p><h4>Lowering (2–3 s)</h4><p>${h(t.ecc)}</p><h4>Cues</h4><ul>${t.cues.map(x=>"<li>"+h(x)+"</li>").join("")}</ul><h4>Avoid</h4><ul>${t.err.map(x=>"<li>"+h(x)+"</li>").join("")}</ul><h4>Muscles</h4><p><strong style="color:var(--tx)">Primary:</strong> ${h(d.pri)}<br><strong style="color:var(--tx)">Secondary:</strong> ${h(d.sec)}</p><button class="btn" style="margin-top:22px" onclick="closeSheet(this)">Got it</button>`;
  openSheet(c);
}
function showPosture(id){
  const pe=PEX[id];if(!pe)return;const img=POSTURE_IMAGES[id];
  let c=`<div class="ttl">${h(pe.name)}</div><span class="pill" style="color:var(--blu);background:rgba(96,165,250,.14);margin-top:8px">POSTURE</span>`+vidCard(POSTURE_VIDEOS[id]);
  if(img)c+=`<img src="${img}" alt="" onerror="this.style.display='none'">`;
  c+=`<h4 style="color:var(--blu)">How to perform</h4><p>${h(pe.tech)}</p><h4 style="color:var(--blu)">Key cues</h4><ul>${pe.cues.map(x=>"<li>"+h(x)+"</li>").join("")}</ul><button class="btn" style="margin-top:22px;background:linear-gradient(135deg,#60a5fa,#3b82f6);box-shadow:0 10px 24px -10px rgba(96,165,250,.6)" onclick="closeSheet(this)">Got it</button>`;
  openSheet(c);
}

init();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

// Lazy-load images.js AFTER app is interactive
(function(){
  var s=document.createElement('script');
  s.src='images.js';
  s.async=true;
  s.onload=function(){render()};
  s.onerror=function(){console.log('images.js not found — running without images')};
  document.body.appendChild(s);
})();
</script>
</body>
